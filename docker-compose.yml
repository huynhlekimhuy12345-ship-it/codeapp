# BI99 deploy bằng Docker: 2 container — app (frontend build + backend)
# và SQL Server 2022. Dữ liệu SQL Server nằm ở volume sqlserver-data
# NGOÀI container, xóa container không mất dữ liệu.
#
# Cách dùng (trên máy host, tại thư mục gốc của repo):
#   1. cp .env.example .env  (file này KHÔNG commit — xem ghi chú dưới)
#   2. Điền MSSQL_SA_PASSWORD (mật khẩu mạnh) và JWT_SECRET vào .env
#   3. docker compose up -d --build
#   4. Khôi phục dữ liệu (lần đầu): xem README.md mục "Đưa dữ liệu cũ vào"
#   5. Mở http://<địa-chỉ-máy-host>:5000
#
# LƯU Ý QUAN TRỌNG:
# - KHÔNG đặt DB_INSTANCE trong .env khi chạy Docker: SQL Server trong
#   container không có instance SQLEXPRESS, app nối qua DB_SERVER=sqlserver
#   + DB_PORT=1433. Đặt DB_INSTANCE là nối sai ngay từ lúc khởi động.
# - Cổng 1433 KHÔNG mở ra host: chỉ app trong cùng mạng Docker mới tới
#   được SQL Server. Muốn dùng SSMS từ host thì bỏ comment dòng ports
#   của sqlserver (chỉ mở 127.0.0.1, tuyệt đối không mở 0.0.0.0).
# - DB_NAME mặc định LeatherShop (khớp script chuyển đổi v2 của shop).

services:
  app:
    build: .
    container_name: bi99-app
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      DB_SERVER: sqlserver
      DB_PORT: "1433"
      DB_NAME: LeatherShop
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bi99-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    # ports:
    #   - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
